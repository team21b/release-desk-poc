name: On PR

# Every PR deploys to the Sandbox org so the change can be seen (and, in step 3, captured) before approval.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: sandbox
  cancel-in-progress: false

jobs:
  sandbox:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: Sandbox
      dry-run: false

  notify:
    name: Send to Release Desk
    needs: [sandbox]
    if: needs.sandbox.result == 'success' && vars.RELEASE_DESK_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Post approval card to Slack
        env:
          URL: ${{ vars.RELEASE_DESK_URL }}
          TOKEN: ${{ secrets.RELEASE_DESK_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          curl -fsS -X POST "$URL/api/notify" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"pr\": $PR}"

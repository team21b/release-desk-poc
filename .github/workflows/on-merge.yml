name: On merge to main

# A merge to main is the approval. The Production environment only accepts jobs from main,
# so this is the one path production credentials can be used from.
on:
  push:
    branches: [main]
    paths: ['force-app/**', 'sfdx-project.json']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate only (no changes to production)
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  production:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: Production
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
